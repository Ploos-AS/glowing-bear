services:
  glowing-bear:
    image: ghcr.io/ploos-as/glowing-bear:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - glowing-bear
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-chat.example.com}
      WEECHAT_RELAY_UPSTREAM: ${WEECHAT_RELAY_UPSTREAM:-host.docker.internal:9001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
