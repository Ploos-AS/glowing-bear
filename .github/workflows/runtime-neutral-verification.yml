name: Runtime-neutral verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Signed release version to qualify
        required: true
        default: '0.2.3'

permissions:
  contents: read

env:
  VERSION: '0.2.3'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select release
        if: github.event_name == 'workflow_dispatch'
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Install Skopeo and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo podman
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Validate script syntax
        run: bash -n scripts/verify-release.sh
      - name: Verify clean immutable output
        shell: bash
        run: |
          set -euo pipefail
          ref="$(VERSION="$VERSION" PULL=0 bash scripts/verify-release.sh)"
          [[ "$ref" =~ ^ghcr\.io/ploos-as/glowing-bear@sha256:[0-9a-f]{64}$ ]]
      - name: Qualify Docker pull path
        shell: bash
        run: |
          set -euo pipefail
          ref="$(VERSION="$VERSION" PULL=1 RUNTIME=docker bash scripts/verify-release.sh)"
          docker image inspect "$ref" >/dev/null
      - name: Qualify Podman pull path
        shell: bash
        run: |
          set -euo pipefail
          ref="$(VERSION="$VERSION" PULL=1 RUNTIME=podman bash scripts/verify-release.sh)"
          podman image inspect "$ref" >/dev/null
      - name: Reject wrong OIDC issuer
        shell: bash
        run: |
          set -euo pipefail
          if VERSION="$VERSION" OIDC_ISSUER=https://example.invalid PULL=0 bash scripts/verify-release.sh >/dev/null 2>&1; then
            echo "verification unexpectedly accepted the wrong issuer" >&2
            exit 1
          fi
