name: Deployment verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Signed release version to qualify
        required: true
        default: '0.2.3'

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/ploos-as/glowing-bear

jobs:
  validate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate verification script syntax
        run: bash -n scripts/verify-release.sh

  verify-deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Select signed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="0.2.3"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify before Docker pull
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PULL: '1'
          RUNTIME: docker
        run: bash scripts/verify-release.sh
