name: Deployment verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Signed release version to qualify
        required: true
        default: '0.2.3'

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/ploos-as/glowing-bear

jobs:
  validate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate M0.11 script syntax
        run: bash -n scripts/verify-release.sh

  verify-deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select signed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="0.2.3"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify before pull
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PULL: '1'
        run: bash scripts/verify-release.sh
