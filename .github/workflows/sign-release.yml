name: Release signing

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/ploos-as/glowing-bear
  WAIT_ATTEMPTS: '60'
  WAIT_SECONDS: '5'

jobs:
  sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ref="$IMAGE:$version"
          digest=""
          for attempt in $(seq 1 "$WAIT_ATTEMPTS"); do
            digest="$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Found $ref at $digest (attempt $attempt/$WAIT_ATTEMPTS)"
              break
            fi
            echo "Waiting for $ref to be published (attempt $attempt/$WAIT_ATTEMPTS)"
            sleep "$WAIT_SECONDS"
          done
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "timed out waiting for $ref" >&2
            exit 1
          fi
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      - name: Sign release image with GitHub OIDC
        env:
          SIGNED_REF: ${{ steps.image.outputs.ref }}
        run: cosign sign --yes "$SIGNED_REF"
