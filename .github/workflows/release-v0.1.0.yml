name: Release v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: c9d6d3086d25a273b462fa5edf21194c1630357d
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/${REPO}/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref='refs/tags/v0.1.0' \
              -f sha="${RELEASE_SHA}"
          fi

          if gh release view v0.1.0 --repo "${REPO}" >/dev/null 2>&1; then
            echo "GitHub Release v0.1.0 already exists"
          else
            gh release create v0.1.0 \
              --repo "${REPO}" \
              --target "${RELEASE_SHA}" \
              --title 'v0.1.0' \
              --notes $'Initial Ploos-AS Glowing Bear OCI container release.\n\n- Glowing Bear upstream 0.10.0 pinned to b53e42f584bd8165287cee5f680e23ffa05198b7\n- linux/amd64 and linux/arm64\n- non-root nginx runtime on port 8080\n- read-only-rootfs compatible\n- health check and hardened Compose/Podman examples\n- SBOM and provenance from the container workflow\n\nImages: ghcr.io/ploos-as/glowing-bear:0.1.0, :0.1, :0 and :latest'
          fi
