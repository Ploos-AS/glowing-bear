name: Finalize v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: read
  packages: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point stable aliases at v0.1.0 manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/ploos-as/glowing-bear:0.1 \
            --tag ghcr.io/ploos-as/glowing-bear:0 \
            --tag ghcr.io/ploos-as/glowing-bear:latest \
            ghcr.io/ploos-as/glowing-bear:0.1.0
