name: Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_VERSION: '0.10.0'
  UPSTREAM_REVISION: 'b53e42f584bd8165287cee5f680e23ffa05198b7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ploos-as/glowing-bear
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GLOWING_BEAR_VERSION=${{ env.UPSTREAM_VERSION }}
            GLOWING_BEAR_REF=${{ env.UPSTREAM_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  relay-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install WeeChat relay qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weechat-headless \
            weechat-plugins \
            python3-pip \
            netcat-openbsd
          python3 -m pip install --break-system-packages -r requirements-qualification.txt
      - name: Configure and start ephemeral WeeChat websocket relay
        shell: bash
        env:
          RELAY_PASSWORD: m02-ci-relay-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weechat"
          weechat-headless --dir "$RUNNER_TEMP/weechat" \
            --run-command "/set relay.network.password $RELAY_PASSWORD" \
            --run-command "/relay add weechat 19001" \
            --run-command "/save" \
            --run-command "/quit"
          weechat-headless --dir "$RUNNER_TEMP/weechat" --daemon
          for _ in {1..30}; do
            if nc -z 127.0.0.1 19001; then exit 0; fi
            sleep 1
          done
          echo "WeeChat relay did not open port 19001" >&2
          exit 1
      - name: Qualify WeeChat websocket relay protocol
        env:
          RELAY_PASSWORD: m02-ci-relay-password
        run: python3 scripts/qualify_weechat_relay.py --password "$RELAY_PASSWORD"
      - name: Show WeeChat diagnostics
        if: always()
        run: ps aux | grep '[w]eechat' || true
      - name: Cleanup WeeChat
        if: always()
        run: pkill -f weechat-headless || true

  browser-relay-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install browser relay qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weechat-headless \
            weechat-plugins \
            python3-pip \
            netcat-openbsd
          python3 -m pip install --break-system-packages -r requirements-browser-qualification.txt
          python3 -m playwright install --with-deps chromium
      - name: Configure and start ephemeral WeeChat websocket relay
        shell: bash
        env:
          RELAY_PASSWORD: m03-ci-relay-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weechat-browser"
          weechat-headless --dir "$RUNNER_TEMP/weechat-browser" \
            --run-command "/set relay.network.password $RELAY_PASSWORD" \
            --run-command "/relay add weechat 19001" \
            --run-command "/save" \
            --run-command "/quit"
          weechat-headless --dir "$RUNNER_TEMP/weechat-browser" --daemon
          for _ in {1..30}; do
            if nc -z 127.0.0.1 19001; then exit 0; fi
            sleep 1
          done
          echo "WeeChat relay did not open port 19001" >&2
          exit 1
      - name: Build and start Glowing Bear container
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg GLOWING_BEAR_VERSION="$UPSTREAM_VERSION" \
            --build-arg GLOWING_BEAR_REF="$UPSTREAM_REVISION" \
            -t glowing-bear:m03 .
          docker run -d --name glowing-bear-browser \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:18080:8080 \
            glowing-bear:m03
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Glowing Bear container did not become ready" >&2
          exit 1
      - name: Qualify Glowing Bear browser to WeeChat relay
        env:
          RELAY_PASSWORD: m03-ci-relay-password
        run: python3 scripts/qualify_browser_relay.py --password "$RELAY_PASSWORD"
      - name: Show M0.3 diagnostics
        if: always()
        run: |
          docker ps -a --filter name=glowing-bear-browser || true
          docker logs glowing-bear-browser || true
          ps aux | grep '[w]eechat' || true
      - name: Cleanup M0.3
        if: always()
        run: |
          docker rm -f glowing-bear-browser || true
          pkill -f weechat-headless || true

  runtime-qualification:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "ref=ghcr.io/ploos-as/glowing-bear:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/ploos-as/glowing-bear:main" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull published image
        run: docker pull "${{ steps.image.outputs.ref }}"
      - name: Start hardened container
        run: |
          docker run -d --name glowing-bear-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:18080:8080 \
            "${{ steps.image.outputs.ref }}"
      - name: Qualify runtime
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | grep -qx 'ok'
          curl --fail --silent http://127.0.0.1:18080/ | grep -qi 'glowing bear'
          uid="$(docker inspect --format '{{.Config.User}}' glowing-bear-smoke)"
          test -n "$uid" && test "$uid" != "0"
          docker exec glowing-bear-smoke sh -c 'test "$(id -u)" -ne 0'
          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' glowing-bear-smoke)"
          test "$health" != "unhealthy"
          version="$(docker inspect --format '{{index .Config.Labels "io.github.ploos-as.upstream.version"}}' glowing-bear-smoke)"
          revision="$(docker inspect --format '{{index .Config.Labels "io.github.ploos-as.upstream.revision"}}' glowing-bear-smoke)"
          test "$version" = "${UPSTREAM_VERSION}"
          test "$revision" = "${UPSTREAM_REVISION}"
      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a --filter name=glowing-bear-smoke
          docker inspect glowing-bear-smoke || true
          docker logs glowing-bear-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f glowing-bear-smoke || true
