name: Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_VERSION: '0.10.0'
  UPSTREAM_REVISION: 'b53e42f584bd8165287cee5f680e23ffa05198b7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ploos-as/glowing-bear
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GLOWING_BEAR_VERSION=${{ env.UPSTREAM_VERSION }}
            GLOWING_BEAR_REF=${{ env.UPSTREAM_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  runtime-qualification:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "ref=ghcr.io/ploos-as/glowing-bear:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=ghcr.io/ploos-as/glowing-bear:main" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull published image
        run: docker pull "${{ steps.image.outputs.ref }}"

      - name: Start hardened container
        run: |
          docker run -d --name glowing-bear-smoke \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:18080:8080 \
            "${{ steps.image.outputs.ref }}"

      - name: Qualify runtime
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/healthz | grep -qx 'ok'
          curl --fail --silent http://127.0.0.1:18080/ | grep -qi 'glowing bear'

          uid="$(docker inspect --format '{{.Config.User}}' glowing-bear-smoke)"
          test -n "$uid"
          test "$uid" != "0"
          docker exec glowing-bear-smoke sh -c 'test "$(id -u)" -ne 0'

          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' glowing-bear-smoke)"
          test "$health" != "unhealthy"

          version="$(docker inspect --format '{{index .Config.Labels "io.github.ploos-as.upstream.version"}}' glowing-bear-smoke)"
          revision="$(docker inspect --format '{{index .Config.Labels "io.github.ploos-as.upstream.revision"}}' glowing-bear-smoke)"
          test "$version" = "${UPSTREAM_VERSION}"
          test "$revision" = "${UPSTREAM_REVISION}"

      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a --filter name=glowing-bear-smoke
          docker inspect glowing-bear-smoke || true
          docker logs glowing-bear-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f glowing-bear-smoke || true
