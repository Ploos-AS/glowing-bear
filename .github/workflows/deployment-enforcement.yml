name: Deployment enforcement

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Signed release version to deploy through the enforced path
        required: true
        default: '0.2.3'

permissions:
  contents: read
  packages: read

env:
  VERSION: '0.2.3'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select release
        if: github.event_name == 'workflow_dispatch'
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Validate scripts
        run: |
          bash -n scripts/deploy-verified-compose.sh
          bash -n scripts/render-verified-quadlet.sh
      - name: Qualify verified Compose deployment
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          bash scripts/deploy-verified-compose.sh
          image="$(docker inspect glowing-bear --format '{{.Config.Image}}')"
          [[ "$image" =~ ^ghcr\.io/ploos-as/glowing-bear@sha256:[0-9a-f]{64}$ ]]
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Qualify verified Quadlet rendering
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          OUTPUT=/tmp/glowing-bear.container bash scripts/render-verified-quadlet.sh
          grep -Eq '^Image=ghcr\.io/ploos-as/glowing-bear@sha256:[0-9a-f]{64}$' /tmp/glowing-bear.container
          ! grep -q '^Image=.*:latest$' /tmp/glowing-bear.container
